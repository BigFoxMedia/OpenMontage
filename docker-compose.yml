# OpenMontage — Coolify-managed deployment (Kleiner homelab, lxc-147).
#
# Secrets (OPENAI_API_KEY / provider keys) are injected by Coolify via the
# application env API and land in .env at deploy time — NEVER hardcode them
# in this file.
#
# Routing is handled by Coolify's docker_compose_domains (router labels are
# generated at deploy time for the backlot service on port 4750).
services:
  backlot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4750:4750"
    environment:
      BACKLOT_PORT: "4750"
      # OpenAI-compatible LLM (LiteLLM gateway) for any direct openai-SDK calls
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    volumes:
      - projects:/app/projects
    restart: unless-stopped

volumes:
  projects:
